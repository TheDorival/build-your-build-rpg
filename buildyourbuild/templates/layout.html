{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Build Your Build{% endblock %}</title>
    {% block extra_css %}{% endblock  %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar">
        <a href="/" class="logo">ByB</a>

        <button class="nav-toggle" aria-label="Abrir menu">&#9776;</button>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/" class="nav-link active" data-nav-type="home">🏠 Início</a>
            </li>
            <li class="nav-item">
                <a href="#sistemas" class="nav-link" data-nav-type="anchor">📚 Sistemas RPG</a>
            </li>
            <li class="nav-item">
                <a href="#funcoes" class="nav-link" data-nav-type="anchor">⚙️ Funções</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'personagem:personagens' %}" class="nav-link" data-nav-type="page">📖 Personagens</a>
            </li>
            <li class="nav-item">
                <a href="#blog" class="nav-link" data-nav-type="anchor">📝 Criar</a>
            </li>
            <li class="nav-item">
                <a href="#contato" class="nav-link" data-nav-type="anchor">💬 Contato</a>
            </li>
            <li class="nav-item">
                <a href="#faq" class="nav-link" data-nav-type="anchor">❓ FAQ</a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/script.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
